jurisdiction = "United States (federal)"
edition = "2026-10-29"

[discount_rate]
rates = [0.03, 0.07]
unit = "real rate per year"
document = "OMB Circular A-4 (17 September 2003), reinstated by OMB Memorandum M-25-15 (12 February 2025), which revoked the 2023 revision"
url = "https://obamawhitehouse.archives.gov/omb/circulars_a004_a-4/"
quote = "For regulatory analysis, you should provide estimates of net benefits using both 3 percent and 7 percent."
reinstatement_url = "https://www.whitehouse.gov/wp-content/uploads/2025/03/M-25-15-Recission-and-Reinstatement-of-Circular-A-4.pdf"
reinstatement_quote = "I revoke Office of Management and Budget Circular A-4 of November 9, 2023 (Regulatory Analysis), and all accompanying appendices, guidelines, and documents. I reinstate Office of Management and Budget Circular A-4 of September 17, 2003"
licence = "US government work (17 U.S.C. 105); no licence stated in the documents"

