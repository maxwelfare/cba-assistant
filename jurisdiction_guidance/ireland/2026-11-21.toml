unit = "index, December 2023 = 100"
publisher = "Central Statistics Office, Ireland"
document = "PxStat table CPA01, Consumer Price Index (Consumer Prices Annual Series), updated 2026-01-15"
url = "https://ws.cso.ie/public/api.restful/PxStat.Data.Cube_API.ReadDataset/CPA01/CSV/1.0/en"
date_read = "2026-11-21"
quote = "Consumer Price Index (Base Dec 2023=100)"
