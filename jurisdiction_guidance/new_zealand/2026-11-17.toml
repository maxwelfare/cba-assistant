url = "http://web.archive.org/web/20261030085123/https://www.treasury.govt.nz/information-and-services/public-sector-leadership/guidance/reporting-financial/discount-rates"
quote = "Commercial proposals (SOC) | 8% | 8% | 8% | 2%"
quote_header = "Public Sector Discount Rates (Real) | Year1-30 | Year31-100 | Year101+ | Sensitivity test(mandatory)"
licence = "not stated on the stored page (its footer links a 'Copyright and licensing' page, not stored)"
source = "treasury_2026_discount_rates_wayback"

[value_of_statistical_life]
value = 12500000
unit = "per statistical life"
currency = "NZD"
price_year = 2021
note = "The manual states its values per injury as at July 2021, entered as calendar year 2021. It takes them from Denne et al. (2023), NZTA Research Report 698, and is the source of the crash and air-pollution values used in New Zealand transport appraisal; for later years it brings injury costs forward by NZTA's published update factors, which are not collected here. The Treasury's Guide to Social Cost Benefit Analysis (2015) gives the superseded $3.85 million as at June 2013 (treasury_2015_guide_scba)."
document = "NZ Transport Agency Waka Kotahi (May 2026). Monetised benefits and costs manual, volume 1: procedures, version 1.7.5, pages 72 and 75"
url = "http://web.archive.org/web/20260912041117/https://www.nzta.govt.nz/assets/resources/monetised-benefits-and-costs-manual/Monetised-benefits-and-costs-manual-volume-1-procedures.pdf"
date_read = "2026-11-21"
quote = "from the 2021 value of statistical life (VoSL) of $12,500,000 (NZ$)."
quote_per_fatality = "The values per injury (as at July 2021) are: ... $12.5 million per fatality"
quote_update = "For project analyses in future years, damage costs for all pollutants should be updated based on the update factor published for injury costs."
