# Korea, values in force on 2026-11-09, read on 2026-11-09 in each stored document's own text (research/sources/<key>/text.txt;
# the document named in each entry). First edition. Each quote is the passage in the stored text, spaces as stored.
# Not collected, because no stored official document states it as one figure: a standalone official value of a statistical life
# or life-year; the road and rail accident cost per death (stated for "2021-2023 average prices", no single price year);
# a general appraisal period for other sectors (informatisation and other fiscal projects are set project by project).
# The [price_index] is the consumer price index (Bank of Korea ECOS, table 901Y009, annual, all items), the index the
# guidance names for correcting benefits and unit values. For costs the guidance names the construction-investment GDP
# deflator, which is not stored here, so a cost stream corrected with this index departs from the guidance's principle.
# Every value was checked against the original document's table or article by a second seat on 2026-11-09.
