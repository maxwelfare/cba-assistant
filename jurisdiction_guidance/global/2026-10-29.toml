# Global benefit-cost analysis: transferring a value of a statistical life to countries of any income, as of 2026-10-29.
# Read in the article's own text on 2026-10-30.
jurisdiction = "Global (transfer by income)"
edition = "2026-10-29"

[value_of_statistical_life_transfer]
reference_case = "VSL in the target country = US VSL x (target GNI per capita / US GNI per capita)^1.5, starting from a US VSL to GNI per capita ratio of 160; at least 20 x the target's GNI per capita"
income_elasticity = 1.5
us_ratio_to_gni_per_capita = 160
floor_ratio_to_gni_per_capita = 20
sensitivity = ["VSL = 160 x GNI per capita (income elasticity 1.0)", "VSL = 100 x GNI per capita"]
document = "Robinson LA, Hammitt JK, O'Keeffe L (2019). Valuing mortality risk reductions in global benefit-cost analysis. Journal of Benefit-Cost Analysis 10(S1):15-50"
url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC7473065/"
quote = "VSL extrapolated from a U.S. estimate to the target country using an income elasticity of 1.5. The starting point for this calculation should be a U.S. VSL to GNI per capita ratio of 160, based on a U.S. VSL of $9.4 million and U.S. GNI per capita of $57,900. If this approach yields a value for the target country less than 20 times GNI per capita for that country, then 20 times GNI per capita should be used instead."
licence = "Creative Commons Attribution licence"

[data_series]
gni_per_capita_ppp = "NY.GNP.PCAP.PP.CD"
ppp_conversion_factor = "PA.NUS.PPP"
official_exchange_rate = "PA.NUS.FCRF"
document = "World Bank, World Development Indicators"
url = "https://api.worldbank.org/v2/indicator/"
note = "The series are named here; their values are collected when a case first needs them."
