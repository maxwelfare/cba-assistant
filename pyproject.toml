[project]
name = "automated-cost-benefit-analysis"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "scipy==1.18.1",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.2.0",
    "scipy-stubs==1.18.1.1",
    "uv==0.13.6",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cost_benefit_engine", "research", "tools"]

[tool.pyright]
typeCheckingMode = "strict"
# The project's own Python, so a plain `pyright` finds scipy and the rest; archive/ is git-ignored old code and
# vendor/ git-ignored programs of others.
venvPath = "."
venv = ".venv"
exclude = ["archive", "vendor", "**/__pycache__", "**/node_modules", "**/.*"]

[tool.pytest.ini_options]
# The general tests (tests/, which need no case), then the tests that live with the case or research folder they test
# (roadmap R29).
testpaths = ["tests"]
