[crossref_works]
name = "Crossref REST API, works"
publisher = "Crossref"
domain = "literature"
geography = "Global"
holds = "The registered record of a DOI: authors, title, journal, dates, licence, and in its link field the addresses of full-text copies. The route to a work's record and landing host in place of a doi.org address."
data_kind = "administrative"
access = "api"
credential = "contact address"
url = "https://api.crossref.org/works"
docs_url = "https://www.crossref.org/documentation/retrieve-metadata/rest-api/access-and-authentication/"
how_to_get = "No account. Crossref asks a client to give a contact email address, which moves its requests to the polite pool. The user gives the address once, as RESEARCH_CONTACT_EMAIL."
signup_url = ""
env_var = "RESEARCH_CONTACT_EMAIL"
key_host = "api.crossref.org"
key_query = "mailto"
limits = "Public pool 5 requests per interval and 1 at a time; polite pool 10 and 3 at a time; HTTP 429 when exceeded, and 403 for a manual block (the documentation page's table, as a seat read it through WebFetch on 2026-11-16)."
terms = "A link or licence field in a record is no promise of access to the full text, whose host sets its own limit (the text-and-data-mining page, read the same way)."
redistribution = "yes"
latest = "not stated"
guide = ""
checked = "2026-11-16: the documentation page, read through WebFetch at 14:06, says \"Include your email address in the `mailto` parameter or `agent` header.\" and \"For this reason we strongly recommend providing a `mailto` parameter in all requests.\"; the quotes were not checked against the page's bytes. The same day the polite fetch sent the address as mailto to https://api.crossref.org/works/10.1038/nature12373, which answered 200 with that DOI's record; Crossref answers 200 without an address too, and the fetch keeps no response header, so the pool that served it was not confirmed."

