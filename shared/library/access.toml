# What a seat can reach, and what it takes: one table per source, service or access, so a new one is one more table.
# The one registry for every project (the owner's ruling, 2026-11-16: "One registry, read by the tool."); tools/access.py
# reads it, and a project points here rather than keeping a copy.
#
# Begun as the cost-benefit project's research/data_sources.toml, on the owner's words of 2026-11-09 (its session
# eb54404a): "this process has a real bias to published stuff. But for many projects data sources like IHME and the ACS
# will allow direct fetching of things we need. Make a list of all the useful data sources like that". Its first 202
# rows were built that day by sixteen source-fetcher agents, one per field. A row states what the pages read that day
# said, and no person has reviewed it. Sites change: read the row's docs_url before relying on a limit.
#
# The menu, one command from this folder's parent:
#   grep -nE '^\[|^holds' library/access.toml
# then read the rows that fit. A source not here that you find and use gets a table here.
#
# WHAT IS HERE AND WHAT IS NOT. A row describes a service: what it opens, the name of its key, where to sign up, its
# terms. That is the same for every user, and this file is public. What one user holds (a key, a contact address, a
# login) is never written here: it is read on that user's machine when a tool runs, by the rule under env_var, and
# `python -m tools.access status` prints which are set, never a value.
#
# Fields:
#   name, publisher, geography, holds    what it is. holds is what it contains, and what an analysis uses it for.
#   domain          the field or fields that listed it.
#   data_kind       measured, survey, administrative, mixed, or modelled estimate. A modelled estimate (IHME's, the UN's
#                   population projections) is a publisher's model built on studies and records, not a measurement.
#   access          api, bulk download, query tool, by application, browser (the user's own, signed in by the user) or
#                   connector (tools a Claude session is given).
#   credential      none, free key, free account, application, paid, contact address (an address the service asks a
#                   polite client to send), login (one only the user can sign in with) or connector.
#   how_to_get, signup_url   the steps a person takes to get the credential. Only a person takes them; no agent makes an
#                   account or requests a key.
#   env_var         the one name of what the user holds for this row; rows that take the same key give the same name.
#                   The value is read when a tool runs and nowhere else. It is the environment variable of this name
#                   (configuration in the environment, the Twelve-Factor App, factor III, Wiggins 2011); where that is
#                   unset or holds only white space, it is the content of the user's file for it, stripped, a byte-order
#                   mark at its start left out: key_file where the row gives one, with ~/ as the user's home, else
#                   ~/.local/share/research-keys/<env_var>. The file is no value when it holds more than one non-empty
#                   line, or when its one line starts with the word export, or with a name of capitals, digits and
#                   underscores that holds an underscore (in quote marks or not), then optional white space and
#                   = or :, or is wrapped in matching quote marks. The tool reads the environment and the file at
#                   every call. For a login the value is the user's declaration that they
#                   hold it (any text, such as the institution's name). A credential of several parts (a user name with
#                   a password), or one a client keeps in its own file, has no variable here: its row says how it is
#                   got. No value is ever written in a repository, a chat or a command.
#   key_file        only where the user's file is not the default one.
#   key_host        the host whose https requests carry the value, sent by the polite fetch (tools/host_cooldown.py).
#   key_header      the header line that carries it there, {value} standing where the value goes, from the service's docs.
#   key_query       or, in place of key_header, the name alone of the query parameter that carries it there, from the
#                   service's docs; the fetch adds it percent-encoded, and sends as given an address that carries it.
#   tools           a connector row only: what the names of its tools start with. No command can see a connector; a
#                   seat has it when its own tool list holds such names.
#   limits, terms, redistribution   rate limits; the terms of use, commercial use included; whether a copy may be passed
#                   on (yes, no, unclear). "not stated" means the pages read did not say, not that there is no limit.
#   latest          the latest release or vintage seen.
#   guide           the key of the source's stored guide in the cost-benefit project's research/refs.toml, or empty.
#   checked         how this row was verified: the real call made and its date, or why it was not tested.


