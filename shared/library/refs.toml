quote = "Rules are more costly to promulgate than standards because rules involve advance determinations of the law's content, whereas standards are more costly for legal advisors to predict or enforcement authorities to apply because they require later determinations of the law's content (pp. 562-563). In summary, the greater the frequency with which a legal command will apply, the more desirable rules tend to be relative to standards. This result arises because promulgation costs are borne only once, whereas efforts to comply with and action to enforce the law may occur rarely or often (p. 577)."
