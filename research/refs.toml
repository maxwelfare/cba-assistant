# Added 2026-11-16 from fragment_sheet_usability.toml.

[mckeever_2009_named_ranges]
citation = "McKeever R, McDaid K, Bishop B (2009). An Exploratory Analysis of the Impact of Named Ranges on the Debugging Performance of Novice Users. Proceedings of EuSpRIG 2009. arXiv:0908.0935."
link = "arxiv:0908.0935"
quote = "the only statistically significant difference in performance relates to the debugging of formula errors, where the experiment group corrected only 44% of errors, while the control group corrected 63%."
status = "2026-11-16: full text (arXiv PDF, 38,751 chars) stored in research/sources/mckeever_2009_named_ranges/ and read in full; quote machine-checked (tools.quotes text), text.txt line 328. 21 second-year computing students debugged a spreadsheet with 42 seeded errors and 152 names, compared with a different earlier group of 34 accounting students on the same spreadsheet without names (not randomised). Names group corrected 47% of errors, comparison group 58%. WARNING: the abstract's 'novice users debug on average significantly fewer errors if the spreadsheet contains named ranges' means fewer errors corrected, not fewer errors in the sheet. Exploratory; the authors call the comparison design weak."

[mckeever_2010_range_names_hinder]
citation = "McKeever R, McDaid K (2010). How do Range Names Hinder Novice Debugging Performance? Proceedings of EuSpRIG 2010. arXiv:1009.2765."
link = "arxiv:1009.2765"
quote = "Range names simply do not help novice debuggers."
status = "2026-11-16: full text (arXiv PDF, 41,681 chars) stored in research/sources/mckeever_2010_range_names_hinder/ and read in part (abstract, results, discussion, conclusion); quote machine-checked, line 866. Controlled follow-up: 29 computing students (14 + 15), randomly assigned to names or cell references, fewer names and shorter names than 2009. Names group corrected 59% of errors, control 66%, and did worse on formula errors that involved no name (statistically significant); mechanisms offered: cognitive load (name plus the range it refers to must both be checked), over-confidence (stop after the first name looks right), not lack of knowledge. No condition in which names help was found; one name-swap error was found more often (27 points), but the same cell's second error was missed by every participant."

[mckeever_2011_naming_conventions]
citation = "McKeever R, McDaid K (2011). Effect of Range Naming Conventions on Reliability and Development Time for Simple Spreadsheet Formulas. Proceedings of EuSpRIG 2011. arXiv:1111.6872."
link = "arxiv:1111.6872"
quote = "formulas developed by non-experts using range names are more likely to contain errors and take longer to develop."
status = "2026-11-16: full text (arXiv PDF, 43,049 chars) stored in research/sources/mckeever_2011_naming_conventions/ and read in part (abstract, results, conclusion); quote machine-checked, line 16. Writing simple summation formulas, names against cell references, within-subject, two groups (15 postgraduates, 17 second-year students; novice to intermediate). Names: 12 and 10 incorrect formulas against 4 and 6 with cell references; about 0.7 and 0.77 minutes longer per task (significant in 4 of 6 tasks in each group). The most structured naming convention showed no significant penalty; an unstructured one was slowest."

[sarkar_2018_calculation_view]
citation = "Sarkar A, Gordon AD, Peyton Jones S, Toronto N (2018). Calculation View: multiple-representation editing in spreadsheets. 2018 IEEE Symposium on Visual Languages and Human-Centric Computing (VL/HCC), pp. 85-93. doi:10.1109/VLHCC.2018.8506584."
link = "doi:10.1109/VLHCC.2018.8506584"
quote = "Participants took less time to complete spreadsheet authoring tasks when using CV than without (median difference of -54 seconds, or a median speed-up of 37.14%)."
status = "2026-11-16: full text (Microsoft Research copy of the author version, PDF, 47,811 chars) stored in research/sources/sarkar_2018_calculation_view/ and read in part (introduction, design, study, results); quote machine-checked, line 540. A within-subject study of 22 participants with a second textual view listing each formula once per block (range assignment) and a cell-naming syntax. The tasks tested were drag-fill and overwrite errors, so the study does not isolate names from range assignment; its speed-up (authoring 37%, debugging 41%) and lower NASA-TLX load are for the combined view. Its authors say naming features 'are not widely used due to high additional interaction and cognitive costs' (line 148). Licence not stated on the copy."

