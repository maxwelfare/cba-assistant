# Germany, consumer price index (Verbraucherpreisindex), annual averages, read from Destatis's long-series report on 2026-11-21.
jurisdiction = "Germany"

[consumer_price_index]
series = "Verbraucherpreisindex für Deutschland (consumer price index), annual average"
publisher = "Statistisches Bundesamt (Destatis)"
release = "Statistischer Bericht: Verbraucherpreisindex für Deutschland - Lange Reihen ab 1948, published 10 July 2025 (Artikelnummer 5611103251065_SB), sheet 611xx-01, column B (Deutschland, Verbraucherpreisindex, 2020 = 100)"
page_url = "https://www.destatis.de/DE/Themen/Wirtschaft/Preise/Verbraucherpreisindex/Publikationen/Downloads-Verbraucherpreise/statistischer-bericht-verbraucherpreisindex-lange-reihen-5611103.xlsx?__blob=publicationFile&v=29"
date_read = "2026-11-21"
base_year_calendar = "2020 = 100"
unit = "index"
source = "destatis_2025_vpi_lange_reihen"
note = "Values 1991 to 2024, read by script (column B of sheet 611xx-01, each stored float rounded to the one decimal Destatis publishes). The report is the last of its series (its title sheet: Letzte Ausgabe dieser Version) and holds no annual average for 2025; the GENESIS database table 61111-0001 that would needs a login (research/sources/destatis_genesis_guide), so 2025 is not recorded."
raw_files = ["raw/statistischer-bericht-verbraucherpreisindex-lange-reihen-5611103.xlsx"]

